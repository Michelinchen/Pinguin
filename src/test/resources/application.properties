# Test-Profil: In-Memory-H2 statt Render-Postgres.
# MODE=PostgreSQL laesst H2 sich moeglichst wie Postgres verhalten.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate baut das Schema aus den Entities selbst auf (create-drop = frisch pro Testlauf).
spring.jpa.hibernate.ddl-auto=create-drop

# Wichtig: schema.sql (Postgres-ALTER-TABLE) NICHT gegen H2 ausfuehren.
spring.sql.init.mode=never
